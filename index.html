<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posterlager</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--line:#e6e2db;--accent:#1d1d1f;--accent-text:#fff;--ph:#efebe4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#212121;--text:#f2f2f2;--muted:#9a9a9f;--line:#333;--accent:#f2f2f2;--accent-text:#161616;--ph:#2b2b2b}}
:root[data-theme="dark"]{--bg:#161616;--card:#212121;--text:#f2f2f2;--muted:#9a9a9f;--line:#333;--accent:#f2f2f2;--accent-text:#161616;--ph:#2b2b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
header{max-width:1000px;margin:0 auto;padding:28px 16px 12px}
h1{margin:0 0 6px;font-size:1.8rem}
header p{margin:0 0 16px;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-text);padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:600}
.grid{max-width:1000px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.img{position:relative;aspect-ratio:2/3;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:.85rem;min-width:30px;height:30px;padding:0 8px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.name{padding:10px 12px;font-weight:600;font-size:.95rem}
footer{max-width:1000px;margin:0 auto;padding:0 16px 40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Posterlager</h1>
  <p>Hitta din favorit och kontakta mig med postern nummer för att beställa.</p>
  <a class="btn" href="#kontakt">Kontakta mig</a>
</header>
<main class="grid" id="grid"></main>
<footer id="kontakt">
  <p>Vill du beställa? Hör av dig och skriv numret på postern du vill ha.</p>
  <a class="btn" href="mailto:din@epost.se">Kontakta mig</a>
</footer>
<script>
// Fyll i namn i listan nedan. Bilderna hämtas från mappen images som 1.jpg, 2.jpg ... 34.jpg
const names = [];
const posters = Array.from({length:34}, (_, i) => ({
  n: i + 1,
  name: names[i] || "Postertitel " + (i + 1),
  img: "images/" + (i + 1) + ".jpg"
}));
const grid = document.getElementById("grid");
posters.forEach(p => {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = '<div class="img"><span class="num">' + p.n + '</span>' +
    ('<img src="' + p.img + '" alt="' + p.name + '" loading="lazy" onerror="this.remove()">') +
    '</div><div class="name">' + p.name + '</div>';
  grid.appendChild(c);
});
</script>
</body>
</html>
